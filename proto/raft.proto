syntax = "proto3";

package raftkv.pb;

// Optimize generated C++ code for speed (default) and enable memory arenas 
// to reduce allocation overhead during heavy replication traffic.
option optimize_for = SPEED;
option cc_enable_arenas = true;


// Inter-Node Consensus RPCs (The Raft Core)

service Raft {
    rpc RequestVote     (RequestVoteArgs)     returns (RequestVoteReply);
    rpc AppendEntries   (AppendEntriesArgs)   returns (AppendEntriesReply);
    rpc InstallSnapshot (InstallSnapshotArgs) returns (InstallSnapshotReply);
}

// Client-Facing KV API
service KV {
    rpc Execute (ClientRequest) returns (ClientReply);   // put/get/del/cas
}


//Core Data Types 

message Command {
    enum Op {
        NOOP   = 0; 
        PUT    = 1; 
        GET    = 2; 
        DELETE = 3; 
        CAS    = 4; 
        CONFIG = 5; 
    }
    Op     op        = 1;
    string key       = 2;
    string value     = 3;     // for PUT / CAS(new)
    string expected  = 4;     // for CAS(old)
    uint64 client_id = 5;     // exactly-once semantics (linearizability)
    uint64 seq_no    = 6;     // monotonically increasing per client
}

message LogEntry {
    uint64  term  = 1;
    uint64  index = 2;
    Command cmd   = 3;
}


// RPC Message Payloads 

message RequestVoteArgs {
    uint64 term           = 1; 
    int32  candidate_id   = 2; 
    uint64 last_log_index = 3; 
    uint64 last_log_term  = 4; 
}

message RequestVoteReply {
    uint64 term         = 1; 
    bool   vote_granted = 2; 
}

message AppendEntriesArgs {
    uint64   term           = 1; 
    int32    leader_id      = 2; 
    uint64   prev_log_index = 3; 
    uint64   prev_log_term  = 4;
    repeated LogEntry entries = 5; 
    uint64   leader_commit  = 6;
}

message AppendEntriesReply {
    uint64 term           = 1; 
    bool   success        = 2; 
    
    // Fast backup optimization
    uint64 conflict_index = 3; 
    uint64 conflict_term  = 4; 
}

message InstallSnapshotArgs {
    uint64 term                = 1; 
    int32  leader_id           = 2; 
    uint64 last_included_index = 3; 
    uint64 last_included_term  = 4; 
    bytes  data                = 5;  // Serialized KV map + client session cache
}

message InstallSnapshotReply {
    uint64 term = 1; 
}


// Client API Payloads

message ClientRequest {
    Command cmd = 1; 
}
message ClientReply {
    bool   ok          = 1;
    bool   is_leader   = 2;   // false => redirect to leader_hint
    int32  leader_hint = 3;   // NodeId of the current known leader
    string value       = 4;   // for GET or failed CAS
    bool   found       = 5;   // for GET (true if key existed)
}